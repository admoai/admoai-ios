# Runs on every PR and on pushes to main: builds the AdMoai package and runs the
# unit + live-integration test target (Swift Testing, needs Xcode 16+).
# A Demo sample-app build step is deferred until the sample compiles again.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same ref supersedes in-flight runs, saving runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin to a stable Xcode that ships the Swift Testing framework the tests import.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build AdMoai package
        run: swift build

      - name: Test (unit + live integration)
        run: swift test
