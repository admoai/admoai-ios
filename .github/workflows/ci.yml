# Runs on every PR and on pushes to main: builds the AdMoai package and runs the
# deterministic (offline) test suite (Swift Testing, needs Xcode 16+).
# Live/real-network tests are gated behind ADMOAI_LIVE_TESTS=1 and excluded here
# so the gate stays deterministic.
#
# `swift build`/`swift test` compile for the macOS host only, so a second job
# compiles the library for an iOS destination: UIKit paths, iOS availability and
# main-actor isolation under the iOS SDK — the first iOS compile an integrator's
# `xcodebuild` would otherwise be. Generic destination: compile only, no simulator.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same ref supersedes in-flight runs, saving runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned so the format gate cannot go red because a new SwiftFormat release changed a
  # rule. Bump on purpose: update both values and run `swiftformat Sources Tests Tools`.
  SWIFTFORMAT_VERSION: 0.64.0
  SWIFTFORMAT_SHA256: 95ea62625d0b898a7af870293311ae6f09e4a3147ecd900593687e4b9ab2fd98

jobs:
  build:
    name: Build & test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin to a stable Xcode that ships the Swift Testing framework the tests import.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Rules and the reason for each disabled one live in .swiftformat.
      # Fix locally with `swiftformat Sources Tests Tools`.
      - name: Format (SwiftFormat --lint)
        run: |
          curl -sSfLo "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          echo "${SWIFTFORMAT_SHA256}  $RUNNER_TEMP/swiftformat.zip" | shasum -a 256 -c -
          unzip -q -o "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          "$RUNNER_TEMP/swiftformat/swiftformat" Sources Tests Tools --lint

      - name: Build AdMoai package
        run: swift build

      # Deterministic gate: live (real-network) tests are disabled unless
      # ADMOAI_LIVE_TESTS=1, so this run is hermetic and stable.
      - name: Test (deterministic — live tests excluded)
        run: swift test

  ios-build:
    name: iOS build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build AdMoai for iOS
        run: >-
          xcodebuild build
          -scheme AdMoai
          -destination 'generic/platform=iOS'
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO

  # The journey-e2e runner runs in adhub's CI on Linux against a mock-seeded engine
  # (admoai/adhub#4346). Building it here on Linux keeps the OSLog/FoundationNetworking
  # shims honest in this repo's own PRs, instead of adhub finding out at the next pin bump.
  linux-e2e-build:
    name: Linux build (journey-e2e)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the E2E runner for Linux
        run: swift build --product journey-e2e

  # Public API baseline (api/AdMoai.api.txt). Red = the API changed and the baseline was not
  # regenerated; the log and job summary classify the change against the merge base, and the
  # regenerated file is attached as the `api-baseline` artifact. Xcode is pinned because the
  # compiler spells the declarations: bump XCODE_API_VERSION on purpose and regenerate.
  api:
    name: Public API check
    runs-on: macos-15
    env:
      XCODE_API_VERSION: '26.3'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the classification needs the merge base with origin/main

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_API_VERSION }}

      - name: Public API check
        run: Tools/api.sh --check

      - name: Upload the regenerated baseline
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-baseline
          path: build/api/AdMoai.api.txt
          if-no-files-found: ignore
          retention-days: 14

  # The shared scenario manifest is vendored from adhub's @admoai/sdk-scenarios package
  # (admoai/adhub#4158): the bytes must be exactly the version MANIFEST_VERSION names, so a
  # scenario edited here instead of in adhub fails this repo's own PR. A newer published
  # version is a warning. The only CI step that reads the registry; the tests never do.
  scenarios:
    name: Scenario manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: The check script's own tests
        run: .github/scripts/scenarios_test.sh
      - name: Tools/JourneyE2E/scenarios.json is the published version it names
        run: .github/scripts/scenarios.sh check Tools/JourneyE2E/scenarios.json
