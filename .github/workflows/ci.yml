# Runs on every PR and on pushes to main: builds the AdMoai package and runs the
# deterministic (offline) test suite (Swift Testing, needs Xcode 16+).
# Live/real-network tests are gated behind ADMOAI_LIVE_TESTS=1 and excluded here
# so the gate stays deterministic.
#
# `swift build`/`swift test` compile for the macOS host only, so a second job
# compiles the library for an iOS destination: UIKit paths, iOS availability and
# main-actor isolation under the iOS SDK — the first iOS compile an integrator's
# `xcodebuild` would otherwise be. Generic destination: compile only, no simulator.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same ref supersedes in-flight runs, saving runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin to a stable Xcode that ships the Swift Testing framework the tests import.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build AdMoai package
        run: swift build

      # Deterministic gate: live (real-network) tests are disabled unless
      # ADMOAI_LIVE_TESTS=1, so this run is hermetic and stable.
      - name: Test (deterministic — live tests excluded)
        run: swift test

  ios-build:
    name: iOS build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build AdMoai for iOS
        run: >-
          xcodebuild build
          -scheme AdMoai
          -destination 'generic/platform=iOS'
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
